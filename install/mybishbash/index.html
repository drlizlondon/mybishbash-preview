<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F2EE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="myBishBash Test" />
    <link rel="manifest" href="/mybishbash-preview/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/mybishbash-preview/icons/mybishbash-cover.png" />
    <link rel="stylesheet" href="/mybishbash-preview/install/install.css" />
    <title>myBishBash Test</title>
  </head>
  <body>
    <main class="install-shell">
      <header class="install-brand">
        <img class="install-brand-logo" src="/mybishbash-preview/icons/mybishbash-logo-mark.png" alt="" />
        <h1>myBishBash</h1>
        <p>private little messages from your earlier self</p>
      </header>
      <section class="install-card">
        <img data-install-icon class="install-icon" src="/mybishbash-preview/icons/mybishbash-cover.png" alt="myBishBash icon" />
        <div class="install-copy">
          <h2 data-version-name>myBishBash</h2>
          <p>Tap Share, then Add to Home Screen.</p>
          <p class="install-note">This version launches straight into your standard myBishBash home.</p>
        </div>
        <div class="install-steps">
          <strong>Install</strong>
          <p>Tap Share, then Add to Home Screen.</p>
        </div>
      </section>
    </main>
    <button type="button" class="install-real-app" data-real-app-button aria-label="Open myBishBash" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 12l4.5-5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 12l-3.2 4.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>myBishBash</span>
    </button>
    <script src="/mybishbash-preview/install/install.js"></script>
